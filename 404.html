<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — Abdul Basit</title>
  <meta name="robots" content="noindex">
  <style>
    @font-face{font-family:'Roboto';font-weight:100 900;font-display:swap;
      src:url('/portfolio/assets/fonts/roboto-latin-var.woff2') format('woff2')}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100svh;display:grid;place-items:center;padding:32px;
      background:#f2f0ee;color:#58595b;font-family:'Roboto',sans-serif;text-align:center}
    .card{background:#fff;border-radius:8px;padding:clamp(36px,7vw,72px);
      box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-width:560px}
    h1{font-size:clamp(3rem,12vw,5rem);font-weight:900;letter-spacing:-.04em;line-height:1;color:#58595b}
    p.k{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.18em;
      color:#e45447;margin:14px 0 12px}
    p{color:#58595b;font-weight:400;line-height:1.7}
    a{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:14px 26px;
      border:1px solid #58595b;border-radius:999px;color:inherit;text-decoration:none;
      font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
    a:hover{background:#e45447;color:#f2f0ee;border-color:#e45447}
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p class="k">page not found</p>
    <p>That link doesn't lead anywhere. It may have moved, or never existed.</p>
    <a href="/portfolio/">back to the site</a>
  </div>
</body>
</html>
