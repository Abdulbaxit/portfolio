<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    Developer seen from behind at a desk.
    Geometry that makes it read: shoulders span x 150-362 (212 wide) while
    the chair back spans x 196-316 (120 wide), leaving ~46px of shirt
    visible either side. When those two were close in width the figure
    looked like a head on top of a chair.
    Skin #e8bd9a, lightened from the original #c58c5c.
  -->

  <ellipse cx="256" cy="470" rx="108" ry="17" fill="#c8ebe8"/>

  <!-- castor base -->
  <path d="M256 424 166 458M256 424 346 458M256 424 256 476"
        stroke="#2f6fb0" stroke-width="12" stroke-linecap="round"/>
  <circle cx="160" cy="460" r="13" fill="#5ecfc4"/>
  <circle cx="352" cy="460" r="13" fill="#5ecfc4"/>
  <circle cx="256" cy="480" r="13" fill="#5ecfc4"/>

  <!-- trouser legs, then shoes -->
  <rect x="198" y="352" width="44" height="72" rx="12" fill="#2f3640"/>
  <rect x="270" y="352" width="44" height="72" rx="12" fill="#2f3640"/>
  <rect x="186" y="410" width="62" height="22" rx="11" fill="#1f2630"/>
  <rect x="264" y="410" width="62" height="22" rx="11" fill="#1f2630"/>

  <!-- gas cylinder between the legs -->
  <rect x="244" y="368" width="24" height="58" rx="10" fill="#3b82c4"/>
  <g fill="#2f6fb0">
    <rect x="244" y="382" width="24" height="4"/>
    <rect x="244" y="392" width="24" height="4"/>
    <rect x="244" y="402" width="24" height="4"/>
  </g>

  <!-- seat -->
  <rect x="168" y="318" width="176" height="42" rx="20" fill="#5ecfc4"/>
  <path d="M168 344c0 10 39 16 88 16s88-6 88-16v6c0 11-39 18-88 18s-88-7-88-18z" fill="#3fa79c"/>

  <!-- Arms. The forearm stops at y=330 and ends in a rounded hand: the
       figure draws over the desk, so a limb running past the desk edge
       reads as severed rather than as resting on the surface. -->
  <rect x="138" y="186" width="46" height="104" rx="23" fill="#e45447"/>
  <rect x="328" y="186" width="46" height="104" rx="23" fill="#e45447"/>
  <path d="M150 268h28a14 14 0 0 1 14 14v34a18 18 0 0 1-18 18h-20a18 18 0 0 1-18-18v-34a14 14 0 0 1 14-14z" fill="#e8bd9a"/>
  <path d="M334 268h28a14 14 0 0 1 14 14v34a18 18 0 0 1-18 18h-20a18 18 0 0 1-18-18v-34a14 14 0 0 1 14-14z" fill="#e8bd9a"/>
  <ellipse cx="164" cy="330" rx="20" ry="11" fill="#d9ab86"/>
  <ellipse cx="348" cy="330" rx="20" ry="11" fill="#d9ab86"/>

  <!-- torso -->
  <path d="M256 148c-60 0-106 30-106 70v92c0 12 10 22 22 22h168c12 0 22-10 22-22v-92c0-40-46-70-106-70z" fill="#e45447"/>
  <path d="M256 148c-26 0-49 6-67 17l20 30c13-8 29-12 47-12s34 4 47 12l20-30c-18-11-41-17-67-17z" fill="#f4796a"/>

  <!-- neck -->
  <rect x="228" y="112" width="56" height="48" rx="20" fill="#e8bd9a"/>
  <path d="M228 112h56v22a28 28 0 0 1-56 0z" fill="#d49f75"/>

  <!-- Head, seen from behind: the back of the skull is hair, with the
       ears and a strip of nape in skin. Previously it was a bare oval,
       which read as a face with no features on it. -->
  <ellipse cx="256" cy="76" rx="58" ry="64" fill="#e8bd9a"/>
  <path d="M256 8c34 0 60 27 60 63v22c0 14-9 23-22 26-11 2-24 4-38 4s-27-2-38-4c-13-3-22-12-22-26V71c0-36 26-63 60-63z" fill="#1a1a1a"/>
  <path d="M256 8c26 0 47 16 56 40-14-12-33-19-56-19s-42 7-56 19c9-24 30-40 56-40z" fill="#2b2b2b"/>
  <ellipse cx="198" cy="86" rx="10" ry="15" fill="#e8bd9a"/>
  <ellipse cx="314" cy="86" rx="10" ry="15" fill="#e8bd9a"/>
  <ellipse cx="198" cy="86" rx="4" ry="7" fill="#d9ab86"/>
  <ellipse cx="314" cy="86" rx="4" ry="7" fill="#d9ab86"/>

  <!-- chair back: deliberately narrower than the shoulders -->
  <rect x="196" y="168" width="120" height="168" rx="26" fill="#5ecfc4"/>
  <rect x="212" y="188" width="88" height="72" rx="16" fill="#49b8ad"/>
  <rect x="245" y="274" width="22" height="48" rx="9" fill="#3d4a56"/>

  <!-- armrests: pad plus a short post down to the seat -->
  <rect x="156" y="280" width="52" height="20" rx="10" fill="#8fdcd4"/>
  <rect x="304" y="280" width="52" height="20" rx="10" fill="#8fdcd4"/>
  <rect x="174" y="298" width="12" height="26" rx="5" fill="#3b82c4"/>
  <rect x="326" y="298" width="12" height="26" rx="5" fill="#3b82c4"/>
</svg>
